<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTK Compliance Checker</title>
<script src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; }
  header { background: #1a3a5c; color: #fff; padding: 16px 24px; }
  header h1 { font-size: 1.2rem; font-weight: 600; }
  header small { opacity: 0.7; font-size: 0.8rem; }
  .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }

  .input-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px #0001; margin-bottom: 20px; }
  textarea { width: 100%; height: 120px; border: 1px solid #ccc; border-radius: 6px;
             padding: 10px; font-size: 0.95rem; resize: vertical; font-family: inherit; }
  textarea:focus { outline: none; border-color: #1a3a5c; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .counter { font-size: 0.8rem; color: #888; }
  .counter.warn { color: #c00; }

  button { padding: 9px 20px; border: none; border-radius: 6px; cursor: pointer;
           font-size: 0.9rem; font-weight: 500; }
  .btn-primary   { background: #1a3a5c; color: #fff; }
  .btn-primary:hover   { background: #254e7a; }
  .btn-escalate  { background: #b85c00; color: #fff; }
  .btn-escalate:hover  { background: #d06800; }
  .btn-ingest    { background: #2e7d32; color: #fff; font-size: 0.8rem; padding: 6px 14px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .results { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 800px) { .results { grid-template-columns: 1fr; } }

  .stage-card { background: #fff; border-radius: 8px; padding: 20px;
                box-shadow: 0 1px 4px #0001; min-height: 120px; }
  .stage-card h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: .05em;
                   color: #888; margin-bottom: 12px; }
  .verdict { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; padding: 8px 14px;
             border-radius: 6px; display: inline-block; }
  .verdict.VIOLATION { background: #fde8e8; color: #c00; }
  .verdict.COMPLIANT { background: #e8f5e9; color: #2e7d32; }
  .verdict.PENDING   { background: #fff3e0; color: #b85c00; }

  .violation { border-left: 3px solid #c00; padding: 10px 12px; margin: 10px 0;
               background: #fff8f8; border-radius: 0 6px 6px 0; }
  .violation .sent { font-style: italic; color: #333; margin-bottom: 6px; font-size: 0.9rem; }
  .violation .cite { font-size: 0.8rem; font-weight: 600; color: #1a3a5c; margin-bottom: 4px; }
  .violation .expl { font-size: 0.85rem; color: #555; }
  .violation .score { font-size: 0.75rem; color: #888; margin-top: 4px; }

  .checked { margin-top: 12px; }
  .checked h3 { font-size: 0.8rem; color: #888; margin-bottom: 6px; }
  .art-tag { display: inline-block; background: #e8f0fa; color: #1a3a5c; padding: 2px 8px;
             border-radius: 4px; font-size: 0.8rem; margin: 2px; }

  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #ccc;
             border-top-color: #1a3a5c; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box { background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px;
               padding: 10px 14px; font-size: 0.85rem; color: #856404; margin-top: 10px; }

  .graph-card { background: #fff; border-radius: 8px; padding: 20px;
                box-shadow: 0 1px 4px #0001; }
  .graph-card h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: .05em;
                   color: #888; margin-bottom: 12px; }
  #graph-container { height: 400px; border: 1px solid #eee; border-radius: 6px; }
  .legend { margin-top: 8px; font-size: 0.78rem; color: #888; }
  .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
                 margin-right: 4px; vertical-align: middle; }

  .ingest-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .ingest-row input { flex: 1; padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.85rem; }
  .ingest-status { font-size: 0.82rem; color: #555; margin-top: 6px; }
</style>
</head>
<body>

<header>
  <h1>PTK Compliance Checker</h1>
  <small>2013. évi V. törvény — Polgári Törvénykönyv</small>
</header>

<div class="container">

  <!-- Input -->
  <div class="input-card">
    <label style="font-size:.9rem;font-weight:600;display:block;margin-bottom:8px">
      Company statement (Hungarian)
    </label>
    <textarea id="stmt" placeholder="Paste the statement to check..."></textarea>
    <div class="row">
      <button class="btn-primary" id="btn-check" onclick="doCheck()">Check</button>
      <button class="btn-escalate" id="btn-escalate" onclick="doEscalate()" style="display:none">
        Run deep analysis
      </button>
      <span class="counter" id="counter">0 / 2000</span>
    </div>
    <!-- Ingest section -->
    <div class="ingest-row">
      <input id="ptk-path" placeholder="Path to ptk.txt (for ingest)" />
      <button class="btn-ingest" onclick="doIngest()">Ingest PTK</button>
    </div>
    <div class="ingest-status" id="ingest-status"></div>
  </div>

  <!-- Results panels -->
  <div class="results" id="results-grid" style="display:none">
    <div class="stage-card">
      <h2>Stage 1 — Fast check (on-prem NLI)</h2>
      <div id="s1-content"></div>
    </div>
    <div class="stage-card">
      <h2>Stage 2 — Deep analysis (Azure LLM)</h2>
      <div id="s2-content"><span style="color:#aaa;font-size:.9rem">Waiting…</span></div>
    </div>
  </div>

  <!-- Subgraph -->
  <div class="graph-card" id="graph-card" style="display:none">
    <h2>Knowledge subgraph — articles consulted</h2>
    <div id="graph-container"></div>
    <div class="legend">
      <span style="background:#1a3a5c"></span> seed (FAISS)
      &nbsp;
      <span style="background:#2e7d32"></span> hop-1
      &nbsp;
      <span style="background:#888"></span> hop-2
      &nbsp;
      <span style="background:#c00"></span> violation
    </div>
  </div>

</div>

<script>
const MAX_CHARS = 2000;
const stmt = document.getElementById('stmt');
const counter = document.getElementById('counter');
const btnCheck = document.getElementById('btn-check');
const btnEscalate = document.getElementById('btn-escalate');

stmt.addEventListener('input', () => {
  const n = stmt.value.length;
  counter.textContent = `${n} / ${MAX_CHARS}`;
  counter.className = 'counter' + (n > MAX_CHARS ? ' warn' : '');
  btnCheck.disabled = n === 0 || n > MAX_CHARS;
});

let _lastStatement = '';
let _network = null;

// ---- check ----
async function doCheck() {
  const text = stmt.value.trim();
  if (!text || text.length > MAX_CHARS) return;
  _lastStatement = text;

  btnCheck.disabled = true;
  btnEscalate.style.display = 'none';
  document.getElementById('results-grid').style.display = 'grid';
  document.getElementById('graph-card').style.display = 'none';
  document.getElementById('s1-content').innerHTML = spinner();
  document.getElementById('s2-content').innerHTML = '<span style="color:#aaa;font-size:.9rem">Waiting…</span>';

  try {
    const r = await post('/check', { statement: text });
    renderS1(r);
    if (r.stage2) renderS2(r);
    if (r.subgraph) renderGraph(r.subgraph, r);
  } catch (e) {
    document.getElementById('s1-content').innerHTML = errBox(e.message);
  } finally {
    btnCheck.disabled = false;
  }
}

// ---- escalate ----
async function doEscalate() {
  btnEscalate.disabled = true;
  document.getElementById('s2-content').innerHTML = spinner();

  try {
    const r = await post('/escalate', { statement: _lastStatement });
    renderS1(r);
    if (r.stage2) renderS2(r);
    if (r.subgraph) renderGraph(r.subgraph, r);
  } catch (e) {
    document.getElementById('s2-content').innerHTML = errBox(e.message);
  } finally {
    btnEscalate.disabled = false;
  }
}

// ---- ingest ----
async function doIngest() {
  const path = document.getElementById('ptk-path').value.trim();
  if (!path) return;
  document.getElementById('ingest-status').textContent = 'Ingesting… (may take a few minutes)';
  try {
    const r = await post('/ingest', { file_path: path });
    document.getElementById('ingest-status').textContent =
      `✓ Done: ${r.articles} articles ingested in ${r.duration_s}s`;
  } catch(e) {
    document.getElementById('ingest-status').textContent = '✗ ' + e.message;
  }
}

// ---- renderers ----
function renderS1(report) {
  const s1 = report.stage1;
  if (!s1) { document.getElementById('s1-content').innerHTML = errBox('No Stage 1 result'); return; }

  const verdict = report.verdict === 'PENDING' ? 'VIOLATION' : s1.verdict;
  let html = `<div class="verdict ${verdict}">${verdict}</div>`;

  if (s1.violations && s1.violations.length > 0) {
    for (const v of s1.violations) {
      html += `<div class="violation">
        <div class="sent">"${esc(v.sentence)}"</div>
        <div class="cite">${esc(v.article_ref)}. § — ${esc(v.article_title || '')}</div>
        <div class="expl">${esc(v.article_excerpt || '')}</div>
        <div class="score">NLI contradiction score: ${(v.contradiction_score * 100).toFixed(1)}%</div>
      </div>`;
    }
    btnEscalate.style.display = 'inline-block';
  }

  if (s1.checked_articles && s1.checked_articles.length > 0) {
    html += `<div class="checked"><h3>Articles checked</h3>`;
    for (const a of s1.checked_articles) {
      html += `<span class="art-tag">${esc(a.article_ref)}</span>`;
    }
    html += '</div>';
  }

  if (report.error && !report.stage2) {
    html += errBox('Stage 2 error: ' + report.error);
  }

  document.getElementById('s1-content').innerHTML = html;
}

function renderS2(report) {
  const s2 = report.stage2;
  if (!s2) {
    document.getElementById('s2-content').innerHTML = errBox(report.error || 'Stage 2 unavailable');
    return;
  }

  let html = `<div class="verdict ${s2.verdict}">${s2.verdict}</div>`;

  if (s2.violations && s2.violations.length > 0) {
    for (const v of s2.violations) {
      html += `<div class="violation">
        <div class="sent">"${esc(v.sentence)}"</div>
        <div class="cite">${esc(v.paragraph_ref || v.article_ref)}</div>
        <div class="expl">${esc(v.explanation)}</div>
      </div>`;
    }
  }

  if (s2.checked_articles && s2.checked_articles.length > 0) {
    html += `<div class="checked"><h3>Articles checked</h3>`;
    for (const a of s2.checked_articles) {
      html += `<span class="art-tag">${esc(a.article_ref)}</span>`;
    }
    html += '</div>';
  }

  if (s2.error) html += errBox('Warning: ' + s2.error);

  document.getElementById('s2-content').innerHTML = html;
  btnEscalate.style.display = 'none';
}

function renderGraph(subgraph, report) {
  if (!subgraph || !subgraph.nodes || subgraph.nodes.length === 0) return;

  // Collect violation refs for colouring
  const violationRefs = new Set();
  if (report.stage2 && report.stage2.violations) {
    for (const v of report.stage2.violations) violationRefs.add(v.article_ref);
  }
  if (report.stage1 && report.stage1.violations) {
    for (const v of report.stage1.violations) violationRefs.add(v.article_ref);
  }

  const colorMap = { seed: '#1a3a5c', hop1: '#2e7d32', hop2: '#888' };

  const nodes = subgraph.nodes.map(n => ({
    id:    n.id,
    label: n.label,
    title: n.title,
    color: violationRefs.has(n.label) ? '#c00' : (colorMap[n.group] || '#888'),
    font:  { color: '#fff', size: 12 },
    shape: 'box',
  }));

  const edges = subgraph.edges.map((e, i) => ({
    id:     i,
    from:   e.from,
    to:     e.to,
    arrows: 'to',
    color:  { color: '#aaa' },
  }));

  document.getElementById('graph-card').style.display = 'block';
  const container = document.getElementById('graph-container');

  if (_network) { _network.destroy(); _network = null; }

  _network = new vis.Network(container,
    { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) },
    {
      physics: { stabilization: { iterations: 100 } },
      interaction: { tooltipDelay: 100 },
      edges: { smooth: { type: 'continuous' } },
    }
  );
}

// ---- helpers ----
function spinner() {
  return '<div style="padding:20px;text-align:center"><div class="spinner"></div></div>';
}
function errBox(msg) {
  return `<div class="error-box">${esc(msg)}</div>`;
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
async function post(url, body) {
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    const t = await r.text();
    throw new Error(`HTTP ${r.status}: ${t}`);
  }
  return r.json();
}
</script>
</body>
</html>
